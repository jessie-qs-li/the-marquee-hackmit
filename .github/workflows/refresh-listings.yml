name: Refresh listings

# The board is a static snapshot, so it only stays current if something
# re-scrapes and redeploys it. Every three hours keeps "today" honest as
# showtimes pass and picks up cinemas publishing later in the week, while
# staying light on the venues' servers.
on:
  schedule:
    - cron: "23 */3 * * *"   # 00:23, 03:23, … off the hour: GitHub queues :00 heavily
  workflow_dispatch:        # and a manual "Run workflow" button
    inputs:
      runner:
        description: "Where to run it"
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest   # reliable, but Cinema Village 403s GitHub's addresses
          - self-hosted     # the Mac: slower and only up when it is, but sees every venue

concurrency:
  group: refresh-listings
  cancel-in-progress: false   # never interrupt a run mid-commit

permissions:
  contents: write             # to push the refreshed schedule back

jobs:
  refresh:
    # Scheduled runs go to GitHub's machines, which are always awake. The
    # self-hosted Mac is reachable by Cinema Village but is a laptop: it
    # sleeps mid-job and its runner dies when the terminal closes, so it is
    # opt-in from the Run workflow button rather than the default.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape New York
        run: node scripts/scrape.mjs

      - name: Scrape Greater Boston
        run: node scripts/scrape.mjs --city boston

      # Refuses to publish a collapsed schedule, and reports whether anything
      # actually changed so a quiet hour costs nothing.
      - name: Check the new listings
        id: check
        run: node scripts/check-refresh.mjs

      - name: Run tests
        if: steps.check.outputs.changed == 'true'
        run: node --test tests/

      - name: Commit the refreshed schedule
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ steps.check.outputs.publish }}
          git commit -m "Refresh listings $(date -u '+%Y-%m-%d %H:%M UTC')"
          # A refresh that lands while someone is pushing to main is rejected
          # as a non-fast-forward, and an otherwise perfect scrape is thrown
          # away. The commit only touches data/, so rebasing onto whatever
          # arrived first is safe; concurrency keeps two refreshes apart.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git pull --rebase origin main || exit 1
          done
          git push

      - name: Deploy to Vercel
        if: steps.check.outputs.changed == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
